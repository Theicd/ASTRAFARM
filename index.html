<!doctype html>

<head>
<meta charset="utf-8" />

<meta name="theme-color" content="#1a3a4a" />

<title>חוות הרובוטים AI</title>

<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<link rel="manifest" href="./manifest.webmanifest" />
<!-- Capture PWA install early (same as Kart / SOS Quake). If we only listen after
     the game module boots, beforeinstallprompt is already gone. -->
<script>
(function () {
  var BUILD = '101';
  window.__astraDeferredInstall = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    window.__astraDeferredInstall = e;
  });
  window.addEventListener('appinstalled', function () {
    window.__astraDeferredInstall = null;
  });
  try {
    if (localStorage.getItem('astra.farm.build') !== BUILD) {
      localStorage.setItem('astra.farm.build', BUILD);
      var bust = Promise.resolve();
      if (window.caches && caches.keys) {
        bust = caches.keys().then(function (keys) {
          return Promise.all(keys.map(function (k) { return caches.delete(k); }));
        });
      }
      bust.then(function () {
        if (!('serviceWorker' in navigator)) return;
        return navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (r) { return r.unregister(); }));
        });
      }).then(function () {
        location.reload();
      }).catch(function () {});
      return;
    }
  } catch (e) { /* ignore */ }
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js?v=' + BUILD).catch(function () {});
    });
  }
})();
</script>
</head>
<body>
<div id="app"></div>
<div id="ui"></div>
<div id="loading">
  <div class="ld-box">
    <img class="ld-icon" src="./icons/icon-192.png" width="96" height="96" alt="" />
    <div class="ld-title" data-i18n="game.title">חוות הפקעות</div>
    <div class="ld-text" data-i18n="boot.loading">טוען…</div>
  </div>
</div>
<noscript>Please enable JavaScript. / אנא הפעילו JavaScript.</noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
